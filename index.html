<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="style.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Atma:wght@300;400;500;600;700&family=Honk&family=Kalnia+Glaze:wght@100..700&family=Nabla&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+IN:wght@100..400&family=Sixtyfour+Convergence&family=Smooch+Sans:wght@100..900&display=swap');
</style>

<body class="pt-5 pb-5 container body">

    <div>
        <div class="d-flex flex-row justify-content-center mb-4">
            <span class="border border-primary p-2 ps-5 pe-5 rounded-pill shadow text-black te">TEXT EDITOR</span>
        </div>

        <div class="border border-primary rounded-3 d-flex flex-row shadow justify-content-around panel">
            <button class="btn btn-light bold"><img src="img assets/type-bold.svg" alt=""></button>
            <button class="btn btn-light italic"><img src="img assets/type-italic.svg" alt=""></button>
            <button class="btn btn-light unter"><img src="img assets/type-underline.svg" alt=""></button>
            <input type="color" class="form-control form-control-color bg-light cinput">
            <button class="btn btn-light unlist"><img src="img assets/list-ul.svg" alt=""></button>
            <button class="btn btn-light orlist"><img src="img assets/list-ol.svg" alt=""></button>
            <button class="btn btn-light back"><img src="img assets/skip-backward-circle-fill.svg" alt=""></button>
            <button class="btn btn-light front"><img src="img assets/skip-forward-circle-fill.svg" alt=""></button>
            <button class="btn btn-light alignl"><img src="img assets/justify-left.svg" alt=""></button>
            <button class="btn btn-light alignc"><img src="img assets/justify.svg" alt=""></button>
            <button class="btn btn-light alignr"><img src="img assets/justify-right.svg" alt=""></button>
            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">Size</button>
                <ul class="dropdown-menu" id="text-size-div">
                    <li><a class="dropdown-item" id="text-size" href="" data-size="10px">1</a></li>
                    <li><a class="dropdown-item" id="text-size" href="" data-size="13px">2</a></li>
                    <li><a class="dropdown-item" id="text-size" href="" data-size="16px">3</a></li>
                    <li><a class="dropdown-item" id="text-size" href="" data-size="18px">4</a></li>
                    <li><a class="dropdown-item" id="text-size" href="" data-size="24px">5</a></li>
                    <li><a class="dropdown-item" id="text-size" href="" data-size="32px">6</a></li>
                    <li><a class="dropdown-item" id="text-size" href="" data-size="48px">7</a></li>
                </ul>
            </div>

            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">Font</button>
                <ul class="dropdown-menu" id="text-font-div">
                    <li><a class="dropdown-item" id="text-font" href="" data-font = "oswald-textO">Political</a></li>
                    <li><a class="dropdown-item" id="text-font" href="" data-font = "smooch-sans-textSS">Technical</a></li>
                    <li><a class="dropdown-item" id="text-font" href="" data-font = "playfair-display-textPD">Aesthetic</a></li>
                    <li><a class="dropdown-item" id="text-font" href="" data-font = "sixtyfour-convergence-textSC">Retro</a></li>
                    <li><a class="dropdown-item" id="text-font" href="" data-font = "atma-medium">Playful</a></li>
                    <li><a class="dropdown-item" id="text-font" href="" data-font = "nabla-textN">Sitcom</a></li>
                    <li><a class="dropdown-item" id="text-font" href="" data-font = "honk-textH">Game</a></li>
                    <li><a class="dropdown-item" id="text-font" href="" data-font = "kalnia-glaze-textKG">Glaze</a></li>
                </ul>
            </div>

            <button class="btn btn-light modes"><img src="img assets/dark-mode-svgrepo-com.svg" alt=""></button>
        </div>

        <div type="text" class="mt-5 border border-primary rounded-3 shadow meinz" contenteditable="true" placeholder="Start typing here......"></div>

        <div class="d-flex flex-row justify-content-center mt-4">
        <p class="border border-primary rounded-pill shadow p-2 wc"> Word count : 0</p>
        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>

</html>
